<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TriaNXT Dev Server</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .container { text-align: center; padding: 48px; background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); max-width: 640px; }
    h1 { font-size: 28px; color: #0f172a; margin-bottom: 8px; }
    .subtitle { color: #64748b; margin-bottom: 24px; font-size: 15px; }
    .badge { display: inline-block; padding: 4px 12px; background: #dcfce7; color: #16a34a; border-radius: 20px; font-size: 13px; font-weight: 600; margin-bottom: 24px; }
    a { display: inline-block; padding: 14px 32px; background: linear-gradient(135deg, #2563eb, #7c3aed); color: #fff; text-decoration: none; border-radius: 10px; font-weight: 600; font-size: 15px; transition: transform 0.2s, box-shadow 0.2s; }
    a:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37, 99, 235, 0.3); }
    .info { margin-top: 20px; font-size: 13px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="container">
    <h1>TriaNXT CTMS</h1>
    <p class="subtitle">Clinical Trial Management System — Development Server</p>
    <div class="badge">✓ Server Running on Port 3001</div>
    <br />
    <a href="http://localhost:3001" target="_blank">Open Application →</a>
    <p class="info">The React dev server is live. Click above to open the full application.</p>
  </div>
</body>
</html>
